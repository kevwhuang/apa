<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Austin Producer Alliance - Coming Soon</title>
    <meta name="description" content="Austin Producer Alliance — launching May 2026.">
    <meta property="og:title" content="Austin Producer Alliance - Coming Soon">
    <meta property="og:description" content="Austin Producer Alliance — launching May 2026.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://austinproduceralliance.com/">
    <meta property="og:image" content="https://austinproduceralliance.com/public/logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Austin Producer Alliance - Coming Soon">
    <meta name="twitter:description" content="Austin Producer Alliance — launching May 2026.">
    <meta name="twitter:image" content="https://austinproduceralliance.com/public/logo.png">
    <link rel="canonical" href="https://austinproduceralliance.com/">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon-16x16.png">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            text-align: center;
            padding: 2rem;
        }

        main {
            max-width: 900px;
            width: 100%;
        }

        h1 {
            font-size: clamp(1.8rem, 4.5vw, 4rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1.4;
            margin-bottom: 3rem;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: #fff;
            margin: 0 auto 3rem;
            opacity: 0.6;
        }

        .date {
            font-size: clamp(1.2rem, 3vw, 1.75rem);
            opacity: 0.6;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 300;
        }
    </style>
</head>

<body>
    <main>
        <h1>Austin Producer Alliance</h1>
        <div class="divider" role="separator" aria-hidden="true"></div>
        <p class="date">Launching May 2026</p>
    </main>
</body>

</html>
