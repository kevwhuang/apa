<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <meta content="light only" name="color-scheme" />
        <title>{{subject}}</title>
    </head>
    <body style="background-color: #f6f1e4; margin: 0; padding: 0">
        <div style="display: none; max-height: 0; max-width: 0; opacity: 0; overflow: hidden">{{preheader}}</div>
        <table
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="background-color: #f6f1e4"
            width="100%"
        >
            <tr>
                <td style="padding: 32px 16px">
                    <table
                        cellpadding="0"
                        cellspacing="0"
                        role="presentation"
                        style="margin: 0 auto; max-width: 600px"
                        width="100%"
                    >
                        <tr>
                            <td style="background-color: #171310; padding: 20px 28px">
                                <p style="color: #f6f1e4; font-family: 'Unbounded', Arial, sans-serif; font-size: 16px; font-weight: 700; line-height: 1.3; margin: 0">Austin Producer Alliance</p>
                            </td>
                        </tr>
                        <tr>
                            <td style="background-color: #faf8f4; border: 2px solid #171310; border-top: 0; padding: 28px">
                                <p style="color: #bb4202; font-family: 'Space Mono', 'Courier New', monospace; font-size: 12px; letter-spacing: 0.06em; line-height: 1; margin: 0 0 16px; text-transform: uppercase">{{label}}</p>
                                <h1 style="color: #171310; font-family: 'Bricolage Grotesque', Arial, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 20px">{{heading}}</h1>
                                {{body}}
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 20px 28px 0">{{footer}}</td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
